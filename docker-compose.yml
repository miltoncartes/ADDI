services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: addi
      POSTGRES_PASSWORD: addi
      POSTGRES_DB: addi
    ports:
      - "5433:5432"
    volumes:
      - addi_postgres_data:/var/lib/postgresql/data

volumes:
  addi_postgres_data:
